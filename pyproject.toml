[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-dev-tools"
version = "0.1.0"
description = "Small, composable agentic tools for everyday dev workflow"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.scripts]
agentic-tools = "agentic_tools.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_tools"]
